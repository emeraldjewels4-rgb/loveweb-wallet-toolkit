name: tests

# Every push and every pull request runs the full suite through run_tests.py.
# That runner is the contract: it exits nonzero if ANY suite fails, so a red
# build here means a failing check, never a lint opinion.
#
# The suites themselves are offline -- in-memory EVMs, compiled mock contracts,
# fake JSON-RPC and fake block-explorer providers -- so nothing in this job
# talks to a real chain and no secrets are needed. The only network access is
# installing dependencies and the solc binary.
#
# Installs are pinned by constraints.txt (see that file): the requirements files
# pin ranges, the constraints file pins the resolved closure, and every job also
# verifies that what it installed is exactly what was pinned.

# Push on main only, plus every pull request. A bare `push:` also fires for
# feature branches, and every branch that has a PR then runs the whole matrix
# twice on the same commit -- six jobs for three suites, for identical results.
# The pull request event is what gives a branch its run, so nothing is lost.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: suites (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only the 3.14 leg sets `experimental`, and only it may fail without
    # turning the workflow red. The three supported interpreters stay gating.
    continue-on-error: ${{ matrix.experimental == true }}

    # The dependency set pins ranges, not exact versions, so the interpreter is
    # part of what can drift. 3.11 is the oldest version every requirement
    # allows; 3.14 is the newest. fail-fast is off so one bad interpreter still
    # leaves the others visible.
    #
    # 3.14 is the leg that may need work: several dependencies here are beta
    # releases upstream (eth-tester, py-evm) and a missing cp314 wheel shows up
    # as an install error, not a test failure. If that happens, the fix is a
    # constraints-py3.14.txt override for the packages that differ -- never a
    # widened range, which would hide the portability finding for every leg.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
          - python-version: "3.12"
          - python-version: "3.13"
          - python-version: "3.14"
            # Gating and required: all four legs passed with every suite run on
            # 3.14, and 'suites (py 3.14)' is one of main's required status
            # checks, so a 3.14-only regression blocks a merge rather than only
            # reddening the run. The only pinned dependency without a cp314
            # build is coincurve, so the step above builds the pinned upstream
            # commit (22.0.0, never published to PyPI) and installs it before
            # the closure is resolved.

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history on purpose: the merge-shape check reads each commit's
          # parents, and a depth-1 clone reports a merge commit as parentless, so
          # that check would pass without inspecting anything.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # The pins decide what gets installed, so a change to them must
          # invalidate the cache too -- otherwise a stale wheel is reused.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
            constraints-py*.txt

      # No coincurve release publishes a cp314 wheel -- 21.0.0 is the newest, and
      # 3.14 support only landed on upstream main (as 22.0.0, never published).
      # bip-utils requires coincurve on 3.12+, so without this step the 3.14 leg
      # cannot resolve its closure at all and dies in INSTALL before a single
      # test runs. Building the pinned upstream commit here installs a
      # distribution that is still named coincurve, so bip-utils' requirement is
      # satisfied; constraints-py3.14.txt pins the version it reports.
      - name: Build coincurve for 3.14 from upstream
        if: matrix.python-version == '3.14'
        env:
          COINCURVE_COMMIT: 872388b6add9851a3057a1914df9fe87ee4a9f65
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Build a wheel, then install it BY NAME from that directory. Both a
          # git URL and a wheel path freeze as 'coincurve @ <url>', which the pin
          # check below cannot read as an ==pin. A name resolved out of a
          # --find-links directory freezes as coincurve==22.0.0, which is exactly
          # what constraints-py3.14.txt pins.
          # pip's output is re-emitted as annotations on failure, because job
          # logs need a scope this workflow's token does not carry.
          wheel_log="${RUNNER_TEMP}/coincurve-wheel.log"
          if ! python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/coincurve-wheel" "git+https://github.com/ofek/coincurve@${COINCURVE_COMMIT}" > "$wheel_log" 2>&1; then
            head -40 "$wheel_log" | sed 's/^/::error::/'
            exit 1
          fi
          python -m pip install --no-deps --no-index --find-links "${RUNNER_TEMP}/coincurve-wheel" "coincurve==22.0.0"
          python -c "import importlib.metadata as m; print('coincurve built from upstream:', m.version('coincurve'))"

      - name: Install pinned dependencies
        env:
          PYVER: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          key="$(echo "$PYVER" | cut -d. -f1-2)"
          if [ -f "constraints-py${key}.txt" ]; then pins="constraints-py${key}.txt"; else pins="constraints.txt"; fi
          echo "governing pins: $pins"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -c "$pins"

      # test_row_key_parity.py runs the real php/keys.php to compare key bytes
      # with Python's. The runner image happens to carry a PHP build; installing
      # php-cli names the dependency instead of relying on that, and a failure
      # here is honest rather than a suite that could not verify the format.
      - name: Install PHP for the key-parity suite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends php-cli
          php -v | head -1

      # test_seed_pool.py compiles a mock QuickSwap router; a fresh runner has
      # no solc, so fetch it here where a download failure is obvious rather
      # than in the middle of a suite.
      - name: Fetch solc for the mock-router fixture
        run: python -c "import solcx; solcx.install_solc('0.8.24')"

      # build/ is gitignored (compiled artifact + vendored OpenZeppelin), and
      # test_token, test_mint, test_distribute_token and test_seed_pool all read
      # build/ProjectToken.json. Without this step a fresh checkout fails four
      # suites with FileNotFoundError, which is exactly what the first CI run
      # did. This is the documented first step in the README.
      - name: Build the contract artifact the token suites read
        run: python build_token.py

      - name: Run every suite
        env:
          # On a pull request HEAD is GitHub's own merge of the branch into main,
          # which is a merge by construction; the shape check must look at the
          # branch head instead, and does so when this is set.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python run_tests.py --json results-${{ matrix.python-version }}.json

      # The numbers this leg measured, kept even when it failed: a red leg is
      # exactly the one whose counts are worth comparing.
      - name: Keep the counts this leg measured
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.python-version }}
          path: results-${{ matrix.python-version }}.json
          if-no-files-found: warn
          retention-days: 14

      # Runs after the suite on purpose: if the pins are wrong, the suite result
      # is worth having as well, and the job still goes red below. Every
      # INSTALLED package must equal its pin. Pins for packages that do not
      # exist on this platform (pywin32 on Linux) are allowed and reported.
      - name: Capture resolved pins and check them against the constraints
        env:
          PYVER: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          key="$(echo "$PYVER" | cut -d. -f1-2)"
          if [ -f "constraints-py${key}.txt" ]; then pins="constraints-py${key}.txt"; else pins="constraints.txt"; fi
          out="resolved-py${key}.txt"
          python -m pip freeze --exclude-editable | sort -f > "$out"
          echo "captured $(wc -l < "$out") pins in $out"
          python - "$pins" "$out" <<'PY'
          import pathlib
          import re
          import sys

          pins_path, freeze_path = sys.argv[1], sys.argv[2]


          def norm(name):
              return re.sub(r"[-_.]+", "-", name).strip().lower()


          def parse(path):
              seen = {}
              for raw in pathlib.Path(path).read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  name, sep, version = line.partition("==")
                  if not sep or not version.strip() or " " in version.strip():
                      print(f"::error file={path}::{line!r} is not an exact ==pin, so it cannot pin anything")
                      sys.exit(1)
                  seen[norm(name)] = version.strip()
              return seen


          pins = parse(pins_path)
          got = parse(freeze_path)

          drift = []
          for name in sorted(got):
              if name not in pins:
                  drift.append(f"UNPINNED  {name}=={got[name]}  ({pins_path} has no pin for it)")
              elif pins[name] != got[name]:
                  drift.append(f"DRIFT     {name}=={got[name]}  (pinned {pins[name]})")

          print(f"{len(got)} package(s) installed, {len(pins)} pin(s) in {pins_path}")
          absent = sorted(name for name in pins if name not in got)
          if absent:
              print("pinned but not installed here, so inert on this platform: " + ", ".join(absent))

          if not drift:
              print("every installed package matches its pin")
              sys.exit(0)

          for line in drift:
              print(f"::error::{line}")
          print("")
          print(f"{len(drift)} package(s) do not match {pins_path}.")
          print(f"The artifact resolved-py contains the full list that was actually installed;")
          print(f"take the versions from there and update {pins_path} so the matrix stays reproducible.")
          sys.exit(1)
          PY

      # The capture itself: the exact closure for this interpreter, whether or
      # not it matched, so a drift failure can be fixed from the diff.
      - name: Upload resolved pins
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-py${{ matrix.python-version }}
          path: resolved-py*.txt
          if-no-files-found: ignore
          retention-days: 14

  # Every leg runs the same suites, so every leg must report the same counts.
  # That claim used to be verified by reading four logs by hand; this compares the
  # artifacts the legs uploaded and fails when one of them disagrees. It needs
  # `tests`, so a failed leg skips this job instead of comparing a missing file.
  counts:
    name: legs agree on the counts
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Collect every leg's results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      - name: Compare the per-suite counts
        run: |
          set -euo pipefail
          ls -l results
          python compare_legs.py results/*.json
